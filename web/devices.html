<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101113">
  <title>DSH Gateway · Devices</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest">
  <link rel="icon" href="/mobile/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/mobile/assets/app.css?v=10">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="/mobile/" aria-label="Back"><svg class="icon"><use href="#i-arrow-left"/></svg></a>
    <span class="brand" data-i18n="devicesTitle">设备管理</span>
    <span class="spacer"></span>
    <button id="refresh" class="icon-btn" type="button" aria-label="Refresh">
      <svg class="icon"><use href="#i-refresh"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题">
      <svg class="icon"><use href="#i-sun"/></svg>
    </button>
  </header>
  <main class="wrap">
    <div class="list" id="device-list"></div>
    <p class="muted" id="empty" hidden data-i18n="noDevices">暂无设备</p>
    <div class="actions">
      <button id="revoke-all" class="btn danger" data-i18n="revokeAll">撤销全部设备</button>
    </div>
  </main>
  <footer>DSH Gateway Mobile</footer>
  <script type="module" src="/mobile/assets/devices.js?v=7"></script>
</body>
</html>
